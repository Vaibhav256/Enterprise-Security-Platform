name: Code Quality

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**/*.py'
      - '.github/workflows/code-quality.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**/*.py'

jobs:
  linting:
    name: Linting & Type Checking
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 mypy black isort pylint
        cd backend && pip install -r requirements.txt
    
    - name: Run Flake8
      working-directory: ./backend
      run: |
        flake8 . \
          --count \
          --select=E9,F63,F7,F82 \
          --show-source \
          --statistics \
          --exclude=venv,eval_venv,htmlcov,__pycache__,.pytest_cache,migrations
      continue-on-error: true
    
    - name: Run Flake8 (warnings)
      working-directory: ./backend
      run: |
        flake8 . \
          --count \
          --exit-zero \
          --max-complexity=15 \
          --max-line-length=120 \
          --statistics \
          --exclude=venv,eval_venv,htmlcov,__pycache__,.pytest_cache,migrations
      continue-on-error: true
    
    - name: Check code formatting with Black
      working-directory: ./backend
      run: |
        black --check --diff . \
          --exclude='/(venv|eval_venv|htmlcov|__pycache__|\.pytest_cache|migrations)/'
      continue-on-error: true
    
    - name: Check import sorting with isort
      working-directory: ./backend
      run: |
        isort --check-only --diff . \
          --skip venv --skip eval_venv --skip htmlcov --skip __pycache__ \
          --skip .pytest_cache --skip migrations
      continue-on-error: true
    
    - name: Run mypy type checking
      working-directory: ./backend
      run: |
        mypy . \
          --ignore-missing-imports \
          --exclude='(venv|eval_venv|htmlcov|__pycache__|\.pytest_cache|migrations)' \
          --no-error-summary \
          || true
      continue-on-error: true
    
    - name: Run Pylint
      working-directory: ./backend
      run: |
        pylint **/*.py \
          --ignore=venv,eval_venv,htmlcov,__pycache__,.pytest_cache,migrations \
          --disable=C0111,C0103,R0903,W0511 \
          --max-line-length=120 \
          --output-format=text \
          || true
      continue-on-error: true
    
    - name: Code Quality Summary
      if: always()
      run: |
        echo "## Code Quality Checks" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ Flake8 linting completed" >> $GITHUB_STEP_SUMMARY
        echo "✅ Black formatting check completed" >> $GITHUB_STEP_SUMMARY
        echo "✅ isort import sorting check completed" >> $GITHUB_STEP_SUMMARY
        echo "✅ mypy type checking completed" >> $GITHUB_STEP_SUMMARY
        echo "✅ Pylint analysis completed" >> $GITHUB_STEP_SUMMARY

  complexity:
    name: Code Complexity Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install radon
      run: |
        python -m pip install --upgrade pip
        pip install radon
    
    - name: Run complexity analysis
      working-directory: ./backend
      run: |
        echo "## Complexity Analysis" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Cyclomatic Complexity" >> $GITHUB_STEP_SUMMARY
        radon cc . -a -s --exclude='venv,eval_venv,htmlcov,__pycache__,.pytest_cache,migrations' >> $GITHUB_STEP_SUMMARY || true
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Maintainability Index" >> $GITHUB_STEP_SUMMARY
        radon mi . --exclude='venv,eval_venv,htmlcov,__pycache__,.pytest_cache,migrations' >> $GITHUB_STEP_SUMMARY || true
