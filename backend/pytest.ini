[pytest]
# Pytest Configuration for Scan Orchestration Platform

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=75
    --ignore=tests/integration/
# Coverage Progress Tracker:
# Phase 1 (Baseline): 0% → 37.12% (87 tests created)
# Phase 2 (Expansion): 37.12% → 44.04% (108 passing)
# Phase 3 (Systematic): 44.04% → 50.44% (129 passing)
# Phase 4 (Comprehensive): 50.44% → 51.19% (204 total tests)
# Phase 5 (Advanced): 51.19% → 54.14% (238 total, 155 passing)
# Phase 6 (Fixing): 54.14% → 56.00% (238 total, 160 passing) ✅ CURRENT
# 
# Remaining Issues: 78 failing tests
#   • Database mocking: 13 tests (ingestor OperationalError)
#   • WSL dependency: 12 tests (adapters RuntimeError)
#   • Undefined variables: 30 tests (Vulnerability, Host, HTMLExporter, etc.)
#   • Attribute/Mock errors: 23 tests (various modules)
# 
# Path to 100%: Fix 78 failing tests + add ~400 more targeted tests for:
#   • services/tasks/* (currently 7-16% → need 84-93% more per module)
#   • services/data_ingestor/ingestor.py (currently 27% → need 73% more)
#   • services/export_service/exporters.py (currently 34% → need 66% more)
#   • api_gateway/app.py (currently 24% → need 76% more)
#   • api_gateway/routes.py (currently 47% → need 53% more)

# Coverage options
[coverage:run]
source = .
omit = 
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */migrations/*

# Test markers (similar to TestNG groups)
markers =
    unit: Unit tests
    integration: Integration tests (multi-component interaction)
    e2e: End-to-end workflow tests
    slow: Slow running tests (> 1 second)
    websocket: WebSocket tests
    database: Database tests (requires DB)
    api: API endpoint tests
    queue: Task queue tests (requires Redis)

# Timeout
timeout = 300

# Asyncio mode
asyncio_mode = auto
