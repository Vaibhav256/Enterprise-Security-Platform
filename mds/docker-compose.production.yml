version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: esp_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-vulnerability_scanner}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - esp_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache and Queue
  redis:
    image: redis:7-alpine
    container_name: esp_redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - esp_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # API Gateway (Backend)
  api_gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: esp_api
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-vulnerability_scanner}
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      
      # Flask
      FLASK_ENV: ${FLASK_ENV:-production}
      FLASK_DEBUG: ${FLASK_DEBUG:-0}
      SECRET_KEY: ${SECRET_KEY:-please-change-this-in-production}
      
      # Security
      ENABLE_RATE_LIMITING: ${ENABLE_RATE_LIMITING:-false}
      
      # Features
      ENABLE_RAG_CHATBOT: ${ENABLE_RAG_CHATBOT:-true}
      ENABLE_THREAT_FEEDS: ${ENABLE_THREAT_FEEDS:-true}
      
      # Paths
      CHROMA_PERSIST_DIR: /app/chroma_db
      
    ports:
      - "${API_PORT:-5000}:5000"
    volumes:
      - ./backend:/app
      - chroma_data:/app/chroma_db
      - scan_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - esp_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # RQ Worker for Scan Processing
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: esp_worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-vulnerability_scanner}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      FLASK_ENV: ${FLASK_ENV:-production}
    volumes:
      - ./backend:/app
      - scan_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - esp_network
    restart: unless-stopped
    command: python start_worker.py

  # Frontend (React + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    container_name: esp_frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - api_gateway
    networks:
      - esp_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # RQ Dashboard (Optional - for monitoring queues)
  rq_dashboard:
    image: eoranged/rq-dashboard:latest
    container_name: esp_rq_dashboard
    environment:
      RQ_DASHBOARD_REDIS_URL: redis://redis:6379
    ports:
      - "${RQ_DASHBOARD_PORT:-9181}:9181"
    depends_on:
      - redis
    networks:
      - esp_network
    restart: unless-stopped
    profiles:
      - monitoring  # Only start with --profile monitoring

networks:
  esp_network:
    driver: bridge
    name: esp_network

volumes:
  postgres_data:
    name: esp_postgres_data
  redis_data:
    name: esp_redis_data
  chroma_data:
    name: esp_chroma_data
  scan_data:
    name: esp_scan_data
